version: 2

models:
  - name: fct_resource_usage_invoices
    description: >
      One row per billing transaction (invoice_id), with credits consumed and the location
      resolved to a country. Aggregate in the marts layer.

      Amounts are in credits, a platform unit, not money: credit_usage has the same distribution
      (0.01 to 100 per transaction) whatever the client's currency, so it is not converted to EUR.
      What a credit costs depends on each client's agreed rate, which is not in the source; the
      client's billing currency is kept for reference only.

      Location is resolved through dim_location by region_code. Only the country is
      kept, because each country currently has one city. Add city_name to the select
      if that changes.
    columns:
      - name: user_id
        description: "{{ doc('col_user_id') }}"
      - name: invoice_id
        description: "{{ doc('col_invoice_id') }} Primary key."
      - name: billed_at
        description: "{{ doc('col_billing_date') }}"
      - name: country
        description: "{{ doc('col_country_name') }} Resolved through dim_location on region_code."
      - name: resource_type
        description: "{{ doc('col_resource_type') }}"
      - name: service_tier
        description: "{{ doc('col_service_tier') }}"
      - name: operation_type
        description: "{{ doc('col_operation_type') }}"
      - name: is_successful
        description: "{{ doc('col_is_successful') }}"
      - name: billing_currency
        description: "{{ doc('col_billing_currency') }}"
      - name: credits_consumed
        description: "{{ doc('col_credits_consumed') }}"
