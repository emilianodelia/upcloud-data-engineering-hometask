version: 2

models:
  - name: build_fct_resource_usage_invoices
    description: "Incremental table behind fct_resource_usage_invoices: adds the country from dim_location and the charged / uncharged credits."
    columns:
      - name: invoice_id
        # scoped to the run's billing window (macros/get_where_subquery.sql) to avoid full scans
        data_tests:
          - unique:
              config:
                where: "billed_at __in_billing_window__"
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: credits_consumed
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: is_successful
        # null would be counted in total_transactions but in neither successful nor failed,
        # so the marts' successful + failed would no longer add up to total
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: credits_charged
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: credits_uncharged
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: country
        # the report report_credit_usage_by_country_daily has one column pair per country:
        # a new country stops the build here until its columns are added there
        data_tests:
          - accepted_values:
              arguments:
                values: ['Finland', 'Germany', 'Japan', 'Poland', 'United States of America']
              config:
                where: "billed_at __in_billing_window__"
