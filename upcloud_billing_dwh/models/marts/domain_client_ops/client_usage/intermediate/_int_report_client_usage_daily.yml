version: 2

models:
  - name: build_report_client_usage_daily
    description: >
      Intermediate step for report_client_usage_daily. Aggregates fct_resource_usage_invoices to
      one row per billing day, client and service tier, with transaction counts and credits
      split by success.
    data_tests:
      - unique:
          column_name: "billed_at || '|' || user_id || '|' || service_tier"
          config:
            where: "billed_at __in_billing_window__"
    columns:
      - name: billed_at
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: user_id
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: billing_currency
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
      - name: service_tier
        data_tests:
          - not_null:
              config:
                where: "billed_at __in_billing_window__"
