version: 2

models:
  - name: report_client_usage_daily
    description: >
      One row per billing day, client (user_id) and service tier, with transaction counts and
      credits. A view over build_report_client_usage_daily (incremental: each run replaces only the days in its billing window, tested there).

      Every measure is additive: sum over any window of days and any set of tiers (e.g. a client's
      monthly credits, usage concentration across clients, each client's tier mix). Ratios such
      as the failure rate are computed after summing, never averaged across rows.

      Active clients: a client is active in a window if they have at least one row in it
      (a transaction, successful or not). Count them with count(distinct user_id): never sum
      counts across days or tiers, since one client has a row per tier and per day.

      Service tier is set per transaction in the source, not per client: a client can use several
      tiers on the same day, so it describes what was consumed, not who the client is.

      Cadence: billing data is ingested once a day, end of day (EOD). Each run loads up to the day
      before the run date, so the latest billed_at is yesterday and the current month is month-to-date.
    columns:
      - name: billed_at
        description: "{{ doc('col_billing_date') }}"
      - name: user_id
        description: "{{ doc('col_user_id') }}"
      - name: billing_currency
        description: "{{ doc('col_billing_currency') }} One per client, so it does not change the grain."
      - name: service_tier
        description: "{{ doc('col_service_tier') }}"
      - name: total_transactions
        description: "{{ doc('col_total_transactions') }}"
      - name: successful_transactions
        description: "{{ doc('col_successful_transactions') }}"
      - name: failed_transactions
        description: "{{ doc('col_failed_transactions') }}"
      - name: credits_charged
        description: "{{ doc('col_credits_charged') }}"
      - name: credits_failed
        description: "{{ doc('col_credits_failed') }}"
