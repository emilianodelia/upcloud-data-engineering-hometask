      - name: avg_daily_credits_charged
        description: "{{ doc('col_avg_daily_credits_charged') }}"
      - name: avg_daily_credits_uncharged
        description: "{{ doc('col_avg_daily_credits_uncharged') }}"

  - name: report_credit_usage_by_country_daily
    description: "Daily charged and uncharged credits, one column pair per country."
    columns:
      - name: billed_at
        description: "{{ doc('col_billing_date') }}"
        data_tests:
          - unique
          - not_null
      - name: finland_credits_charged
        description: "{{ doc('col_credits_charged') }} Finland only."
      - name: finland_credits_uncharged
        description: "{{ doc('col_credits_uncharged') }} Finland only."
      - name: germany_credits_charged
        description: "{{ doc('col_credits_charged') }} Germany only."
      - name: germany_credits_uncharged
        description: "{{ doc('col_credits_uncharged') }} Germany only."
      - name: japan_credits_charged
