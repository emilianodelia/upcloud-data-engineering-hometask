        description: "{{ doc('col_credits_charged') }}"
      - name: credits_uncharged
        description: "{{ doc('col_credits_uncharged') }}"
      - name: total_transactions
        description: "{{ doc('col_total_transactions') }}"
      - name: successful_transactions
        description: "{{ doc('col_successful_transactions') }}"
      - name: failed_transactions
        description: "{{ doc('col_failed_transactions') }}"
      - name: failure_rate
        description: "{{ doc('col_failure_rate') }}"
      - name: avg_credits_per_transaction
