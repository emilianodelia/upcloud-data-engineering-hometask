version: 2

models:
  - name: report_billing_daily
    description: >
      One row per billing day, country, resource type, service tier and operation type,
      with transaction counts and credits. A view over build_report_billing_daily (incremental: each run replaces
      only the days in its billing window, tested there).

      Cadence: billing data is ingested once a day, end of day (EOD). Each run loads
      up to the day before the run date, so the latest billed_at is yesterday and there
      is no intraday data. "Daily" in the name is the grain, not the refresh frequency.

      Every measure is additive: sum it over any combination of dimensions and days
      (e.g. monthly credits charged per country). Distinct users are not here because they do
      not add up; use report_client_usage_daily for those.

      Credits charged count successful transactions only, with consumption positive. Failed
      transactions are kept as separate count and credit columns. Amounts are credits, a platform
      unit, not money: see fct_resource_usage_invoices.
      The latest month is partial until it ends.
    columns:
      - name: billed_at
        description: "{{ doc('col_billing_date') }}"
      - name: country
        description: "{{ doc('col_country_name') }}"
      - name: resource_type
        description: "{{ doc('col_resource_type') }}"
      - name: service_tier
        description: "{{ doc('col_service_tier') }}"
      - name: operation_type
        description: "{{ doc('col_operation_type') }}"
      - name: total_transactions
        description: "{{ doc('col_total_transactions') }}"
      - name: successful_transactions
        description: "{{ doc('col_successful_transactions') }}"
      - name: failed_transactions
        description: "{{ doc('col_failed_transactions') }}"
      - name: credits_charged
        description: "{{ doc('col_credits_charged') }}"
      - name: credits_failed
        description: "{{ doc('col_credits_failed') }}"
